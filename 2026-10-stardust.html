<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;background:#000}</style>
</head>
<body>
<title>Stardust, Developed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=DM+Mono:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
/* Layout: one full-bleed canvas film; HUD top, caption lower-left, transport bar at the foot. Single dark look by design. */
:root{
  --bg:#000; --ink:#f3f1ec; --dim:rgba(243,241,236,.62); --faint:rgba(243,241,236,.16); --line:rgba(243,241,236,.34); --gold:#f2c27a; --goldf:rgba(242,194,122,.45);
  --serif:"Cormorant Garamond","Iowan Old Style",Garamond,"Times New Roman",serif;
  --sans:"Jost","Futura","Avenir Next","Helvetica Neue",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,44px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--serif);-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.shade{position:fixed;left:0;right:0;bottom:0;height:42vh;background:linear-gradient(to top,rgba(0,0,0,.92) 40%,rgba(0,0,0,0));pointer-events:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:var(--gut);right:var(--gut);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
.brand{font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.46em}
.brand small{display:block;margin-top:7px;font-family:var(--mono);font-weight:300;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.clock{text-align:right;font-family:var(--mono)}
.yrs{font-size:clamp(15px,1.9vw,20px);font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
.ago{margin-top:5px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.cap{position:fixed;left:var(--gut);right:var(--gut);top:min(65%,calc(100% - 250px));display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
.chap{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity .5s ease}
.chap::before,.chap::after{content:"";width:28px;height:1px;background:var(--goldf)}
.cap.in .chap{opacity:1}
.line{margin:12px 0 0;max-width:22ch;font-size:clamp(25px,3.4vw,44px);font-weight:500;line-height:1.12;text-wrap:balance}
.aside{margin:12px 0 0;max-width:34rem;font-style:italic;font-size:clamp(16.5px,1.75vw,21px);line-height:1.38;color:var(--dim);text-wrap:balance}
.w{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(5px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1),filter .7s ease}
.cap.in .w{opacity:1;transform:none;filter:none}
.cap.out .w{transition-duration:.25s;transition-delay:0s!important}
@media (prefers-reduced-motion:reduce){.w{transition:opacity .3s ease;transform:none;filter:none}}
.ctrl{position:fixed;z-index:5;left:var(--gut);right:var(--gut);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.ctrl button,.end button,.intro button{background:transparent;border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;padding:7px 13px;border-radius:999px;cursor:pointer;transition:border-color .2s;white-space:nowrap}
button:hover{border-color:var(--ink)}
button:focus-visible,.track:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.track{position:relative;flex:1;min-width:0;height:24px;cursor:pointer;touch-action:none}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--faint)}
.fill{position:absolute;left:0;top:50%;height:1px;width:0;background:var(--ink)}
.tick{position:absolute;top:calc(50% - 3px);width:1px;height:7px;background:var(--line)}
.knob{position:absolute;top:calc(50% - 4.5px);width:9px;height:9px;margin-left:-4.5px;border:1px solid var(--ink);border-radius:50%;background:var(--bg)}
#tc{min-width:4.6ch;text-align:right;font-variant-numeric:tabular-nums}
#flash{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}
.end{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-inline:var(--gut);padding-bottom:40px;background:var(--bg);text-align:center;opacity:0;pointer-events:none}
.end.live{pointer-events:auto}
.endbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
#backBtn{border-color:rgba(242,194,122,.6);color:var(--gold)}
.embedded .hud{right:calc(var(--gut) + 200px)}
@media (max-width:760px){.embedded .hud{right:calc(var(--gut) + 56px)}}
.end svg{width:min(72vw,400px);height:auto;overflow:visible}
.end svg .s{fill:none;stroke:var(--ink);stroke-width:1.15;stroke-linejoin:round;stroke-dasharray:1 1}
.end svg .i{stroke-width:.7;opacity:.42}
.word{font-family:var(--sans);font-weight:300;font-size:13px;letter-spacing:.78em;margin-right:-.78em;text-transform:uppercase}
.tag{max-width:30rem;margin:6px 0 0;font-size:clamp(20px,2.6vw,27px);font-weight:500;line-height:1.25;text-wrap:balance}
.tag em{display:block;margin-top:6px;font-weight:400;color:var(--dim)}
.meta{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.intro{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:var(--gut);text-align:center;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.2),rgba(0,0,0,.92) 60%);transition:opacity .9s ease}
.intro.gone{opacity:0;pointer-events:none}
.intro .eye{font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.intro h1{margin:0;font-weight:500;font-size:clamp(42px,7.4vw,88px);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.intro p{margin:0;font-style:italic;font-size:clamp(17px,2vw,21px);color:var(--dim)}
.intro button{margin-top:14px}
.intro .hint{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.22em;text-transform:uppercase}
@media (max-width:560px){
  .brand small{display:none}
  #rp{display:none}
}
</style>

<canvas id="cv" aria-label="Animated film: the metal in a camera, from the hearts of stars to a photograph of the stars"></canvas>
<div class="shade"></div>
<header class="hud">
  <div class="brand">ADDO<small>Magic Moment · October 2026</small></div>
  <div class="clock"><div class="yrs" id="yrs">13.8 billion</div><div class="ago" id="ago">years ago</div></div>
</header>
<section class="cap out" id="cap" aria-live="polite">
  <div class="chap" id="chap"></div>
  <p class="line" id="line"></p>
  <p class="aside" id="aside"></p>
</section>
<div class="end" id="end">
  <svg viewBox="44 350 967 300" aria-label="Addo Studios">
    <g id="lfill" opacity="0" fill="#f3f1ec">
      <path d="M56 638 L176 362 L303 638 Z"/>
      <path d="M329 383 L387 383 A127.5 127.5 0 0 1 387 638 L329 638 Z"/>
      <path d="M543 383 L601 383 A127.5 127.5 0 0 1 601 638 L543 638 Z"/>
      <circle cx="873" cy="510.5" r="125.5"/>
    </g>
    <path class="s" pathLength="1" d="M56 638 L176 362 L303 638 Z"/>
    <path class="s i" pathLength="1" d="M86 624 L176 398 L280 624 Z"/>
    <path class="s" pathLength="1" d="M329 383 L387 383 A127.5 127.5 0 0 1 387 638 L329 638 Z"/>
    <path class="s i" pathLength="1" d="M343 397 L387 397 A113.5 113.5 0 0 1 387 624 L343 624 Z"/>
    <path class="s" pathLength="1" d="M543 383 L601 383 A127.5 127.5 0 0 1 601 638 L543 638 Z"/>
    <path class="s i" pathLength="1" d="M557 397 L601 397 A113.5 113.5 0 0 1 601 624 L557 624 Z"/>
    <circle class="s" pathLength="1" cx="873" cy="510.5" r="125.5"/>
    <circle class="s i" pathLength="1" cx="873" cy="510.5" r="111.5"/>
  </svg>
  <div class="word" id="word">Studios</div>
  <p class="tag" id="tag">Everything we shoot is made of stars.<em>Even the camera.</em></p>
  <div class="meta" id="meta">Addo Studios · Toronto</div>
  <div class="endbtns"><button id="again">Watch again</button><button id="backBtn" hidden>Back to portfolio</button></div>
</div>
<div id="flash"></div>
<nav class="ctrl" aria-label="Playback">
  <button id="pp">Play</button>
  <div class="track" id="track" tabindex="0" role="slider" aria-label="Timeline" aria-valuemin="0" aria-valuemax="58" aria-valuenow="0"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
  <span id="tc">0:00</span>
  <button id="snd" aria-pressed="true">Sound on</button>
  <button id="rp">Restart</button>
</nav>
<div class="intro" id="intro">
  <div class="eye">Addo Studios presents</div>
  <h1>Stardust, Developed</h1>
  <p>Your camera is older than the Sun.</p>
  <button id="go">Play with sound</button>
  <p class="hint">About a minute · best with sound</p>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,INK='#f3f1ec',GOLD='#f2b85e',GOLDL='#ffdca0',END=58,FLASH=49.5;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,v)=>{const t=clamp((v-a)/(b-a));return t*t*(3-2*t)};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const hash=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let W=0,H=0,DPR=1,U=1,SS=1,PXS=1,SA=1,BOIL=0,SEEDC=0,vig=null;
const b1=document.createElement('canvas'),bx1=b1.getContext('2d'),b2=document.createElement('canvas'),bx2=b2.getContext('2d'),HASF='filter' in bx1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);U=Math.min(W,H)/1000;
  SS=Math.min(H*.54,W*.92)/600;
  vig=document.createElement('canvas');vig.width=W;vig.height=H;const v=vig.getContext('2d');
  const g=v.createRadialGradient(W/2,H*.4,Math.min(W,H)*.3,W/2,H*.4,Math.hypot(W,H)*.62);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.7)');v.fillStyle=g;v.fillRect(0,0,W,H);
  b1.width=Math.max(1,Math.ceil(W/3));b1.height=Math.max(1,Math.ceil(H/3));b2.width=Math.max(1,Math.ceil(W/8));b2.height=Math.max(1,Math.ceil(H/8));
}
addEventListener('resize',resize);resize();
const grains=[0,1,2,3].map(k=>{const c=document.createElement('canvas');c.width=c.height=220;const g=c.getContext('2d');const d=g.createImageData(220,220);const r=rng(k+5);
  for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=255;d.data[i+3]=r()<.5?r()*30:0}g.putImageData(d,0,0);return ctx.createPattern(c,'repeat')});
function bloom(){
  bx1.globalCompositeOperation='copy';if(HASF)bx1.filter='blur(2.5px)';bx1.drawImage(cv,0,0,b1.width,b1.height);if(HASF)bx1.filter='none';
  bx2.globalCompositeOperation='copy';if(HASF)bx2.filter='blur(4px)';bx2.drawImage(b1,0,0,b2.width,b2.height);if(HASF)bx2.filter='none';
  ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.42;ctx.drawImage(b1,0,0,W,H);ctx.globalAlpha=.5;ctx.drawImage(b2,0,0,W,H);ctx.restore()}

/* ---------- drawing primitives ---------- */
function jit(k,a){if(!a)return 0;const v=Math.sin(k*12.9898+BOIL*78.233)*43758.5453;return(v-Math.floor(v)-.5)*2*a}
function trace(q,closed,sm){const n=q.length;
  if(!sm||n<3){ctx.moveTo(q[0][0],q[0][1]);for(let i=1;i<n;i++)ctx.lineTo(q[i][0],q[i][1]);if(closed)ctx.closePath();return}
  if(closed){ctx.moveTo((q[n-1][0]+q[0][0])/2,(q[n-1][1]+q[0][1])/2);for(let i=0;i<n;i++){const p=q[i],nx=q[(i+1)%n];ctx.quadraticCurveTo(p[0],p[1],(p[0]+nx[0])/2,(p[1]+nx[1])/2)}ctx.closePath()}
  else{ctx.moveTo(q[0][0],q[0][1]);for(let i=1;i<n-1;i++){const p=q[i],nx=q[i+1];ctx.quadraticCurveTo(p[0],p[1],(p[0]+nx[0])/2,(p[1]+nx[1])/2)}ctx.lineTo(q[n-1][0],q[n-1][1])}}
function curve(pts,o){
  o=o||{};const n=pts.length;if(n<2)return;const col=o.col||INK;
  const w=(o.w||1)/PXS,a=o.a==null?1:o.a,j=(o.j==null?.6:o.j)/PXS,sm=o.smooth!==false,passes=o.passes||2,sd=(SEEDC+=31);
  if(a<=.003&&!o.fill)return;
  if(o.glow&&a>.01){ctx.save();ctx.globalCompositeOperation='lighter';ctx.beginPath();trace(pts,!!o.closed,sm);ctx.strokeStyle=col;
    ctx.globalAlpha=SA*a*.16*o.glow;ctx.lineWidth=w*7;ctx.stroke();ctx.globalAlpha=SA*a*.3*o.glow;ctx.lineWidth=w*3;ctx.stroke();ctx.restore()}
  for(let p=0;p<passes;p++){
    const q=new Array(n);for(let i=0;i<n;i++)q[i]=[pts[i][0]+jit(sd+i*2+p*977,j),pts[i][1]+jit(sd+i*2+1+p*977,j)];
    ctx.beginPath();trace(q,!!o.closed,sm);
    if(o.fill&&p===0){ctx.globalAlpha=SA*(o.fa==null?1:o.fa);ctx.fillStyle=o.fill;ctx.fill()}
    ctx.globalAlpha=SA*a*(p?.34:1);ctx.lineWidth=p?w*.6:w;ctx.strokeStyle=col;ctx.stroke()}}
function seg(x1,y1,x2,y2,w,a,col){ctx.globalAlpha=SA*a;ctx.lineWidth=w/PXS;ctx.strokeStyle=col||INK;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circ(x,y,r,n){const p=[];n=n||Math.max(10,Math.min(80,Math.round(r*PXS*.5)+10));for(let i=0;i<n;i++){const t=i/n*TAU;p.push([x+Math.cos(t)*r,y+Math.sin(t)*r])}return p}
function ell(x,y,rx,ry,a0,a1,n){const p=[];n=n||40;for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;p.push([x+Math.cos(t)*rx,y+Math.sin(t)*ry])}return p}
function dot(x,y,r,a,col){ctx.globalAlpha=SA*a;ctx.fillStyle=col||INK;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function glow(x,y,r,a,rgb){if(a<=0||r<=0)return;a=Math.min(1,a);rgb=rgb||'255,255,255';const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba('+rgb+','+a+')');g.addColorStop(.3,'rgba('+rgb+','+a*.22+')');g.addColorStop(1,'rgba('+rgb+',0)');ctx.globalAlpha=SA;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}
const GRGB='255,196,110';
function hatch(x0,y0,x1,y1,sp,ang,al,col){ctx.globalAlpha=SA*al;ctx.strokeStyle=col||INK;ctx.lineWidth=.55/PXS;ctx.beginPath();const ca=Math.cos(ang),sa=Math.sin(ang),cx=(x0+x1)/2,cy=(y0+y1)/2,R=Math.hypot(x1-x0,y1-y0);
  for(let d=-R;d<R;d+=sp){const px=cx-sa*d,py=cy+ca*d;ctx.moveTo(px-ca*R,py-sa*R);ctx.lineTo(px+ca*R,py+sa*R)}ctx.stroke()}
function text(s,x,y,px,o){o=o||{};ctx.globalAlpha=SA*(o.a==null?1:o.a);ctx.fillStyle=o.col||INK;ctx.font=(o.w||400)+' '+(px/PXS)+'px '+(o.serif?'"Cormorant Garamond",Garamond,serif':'"DM Mono",ui-monospace,Menlo,monospace');ctx.textAlign=o.align||'center';ctx.textBaseline='middle';
  if(o.ls&&'letterSpacing' in ctx){ctx.letterSpacing=(o.ls/PXS)+'px'}ctx.fillText(s,x,y);if('letterSpacing' in ctx)ctx.letterSpacing='0px'}
function stage(sx,sy,sc){ctx.save();ctx.translate(W/2,H*.35);ctx.scale(SS*(sc||1),SS*(sc||1));ctx.translate(-(sx||0),-(sy||0));PXS=SS*(sc||1)}
function unstage(){ctx.restore();PXS=1}

/* ---------- path tools: sampling, partial reveal, particle morphs ---------- */
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L}
function sample(paths,N){const lens=paths.map(plen),tot=lens.reduce((a,b)=>a+b,0),out=[];
  for(let k=0;k<N;k++){let d=(k+.5)/N*tot,pi=0;while(pi<paths.length-1&&d>lens[pi]){d-=lens[pi];pi++}const p=paths[pi];
    for(let i=1;i<p.length;i++){const sl=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(d<=sl||i===p.length-1){const f=sl?Math.min(1,d/sl):0;out.push([lerp(p[i-1][0],p[i][0],f),lerp(p[i-1][1],p[i][1],f)]);break}d-=sl}}return out}
function partial(paths,frac,o){if(frac<=0)return;if(frac>=1){for(const p of paths)curve(p,o);return}
  const lens=paths.map(plen),tot=lens.reduce((a,b)=>a+b,0);let rem=frac*tot;
  for(let i=0;i<paths.length&&rem>0;i++){const p=paths[i];if(rem>=lens[i]){curve(p,o);rem-=lens[i];continue}
    const part=[p[0]];let d=rem;for(let j=1;j<p.length;j++){const sl=Math.hypot(p[j][0]-p[j-1][0],p[j][1]-p[j-1][1]);if(d>=sl){part.push(p[j]);d-=sl}else{const f=sl?d/sl:0;part.push([lerp(p[j-1][0],p[j][0],f),lerp(p[j-1][1],p[j][1],f)]);break}}
    curve(part,o);const e=part[part.length-1];glow(e[0],e[1],14,.5,GRGB);rem=0}}
const flowA=(x,y,t)=>Math.sin(x*.011+t*.4)*1.4+Math.cos(y*.013-t*.3)*1.2+Math.sin((x+y)*.006+t*.2);
function morph(A,B,t0,t1,t,amp){
  const N=Math.min(A.length,B.length),dur=t1-t0;if(t<=t0||t>=t1)return;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineWidth=1.1/PXS;
  for(let i=0;i<N;i++){const st=t0+(i/N)*dur*.35,e0=clamp((t-st)/(dur*.65));if(e0<=0||e0>=1)continue;
    const pos=e=>{const k=ease(e),a=flowA(A[i][0],A[i][1],i*.01)+hash(i)*2,m=Math.sin(Math.PI*k)*amp*(.4+hash(i+.3));return[lerp(A[i][0],B[i][0],k)+Math.cos(a)*m,lerp(A[i][1],B[i][1],k)+Math.sin(a)*m]};
    const p=pos(e0),q=pos(Math.max(0,e0-.05)),gold=hash(i+.7)<.75;
    ctx.globalAlpha=SA*(.55+.45*Math.sin(Math.PI*e0));ctx.strokeStyle=gold?GOLDL:INK;ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(p[0],p[1]);ctx.stroke()}
  ctx.restore()}
function auMark(x,y,a,lbl,t){if(a<=0)return;const pulse=1+.25*Math.sin(t*5);glow(x,y,26*pulse,.55*a,GRGB);dot(x,y,3,a,GOLDL);
  curve(circ(x,y,9*pulse,20),{w:.8,a:a*.8,col:GOLD,passes:1});if(lbl)text('Au',x+14,y-12,10,{a:a*.9,col:GOLDL})}
function stars(a,t,seed){if(a<=0)return;ctx.fillStyle=INK;for(let i=0;i<240;i++){const h=hash(i*1.13+seed),x=h*W,y=hash(i*2.31+seed)*H,tw=.6+.4*Math.sin(t*(1+hash(i)*3)+i);

  at(11.35,t=>{boom(t,.75);bell(n('E6'),t,.08,3.4);bell(n('B6'),t+.06,.06,3);bell(n('G6'),t+.12,.05,3);shimmer(t,2.5,.05)});
  at(13.1,t=>chirp(t,3.9));
  k=0;for(let b=13.3;b<16.9;b+=.5,k++){const nm=['E5','B5','G5','D6'][k%4];at(b,t=>pluck(n(nm),t,.04,.5,{type:'sine',del:.4}))}
  at(17,t=>{boom(t,.7);['A6','E6','C#6','A5','E5'].forEach((nm,i)=>bell(n(nm),t+i*.07,.07,2.6));shimmer(t,2.4,.06)});
  for(let i=0;i<10;i++){const tt=17.3+r()*1.6,m=n(['A6','C#7','E7','B6'][Math.floor(r()*4)]);at(tt,t=>bell(m,t,.03,1.4))}
  const dr=['G4','D5','B4','F#5','A4','E5','D5','B4'],dd=['D4','A4','F#4','E5','A4','D5','F#5','E5'];k=0;for(let b=19.4;b<25;b+=.333,k++){const nm=(b<22.2?dr:dd)[k%8];at(b,t=>pluck(n(nm),t,.06,.8,{type:'sine',del:.4}))}
  at(21.2,t=>noise(t,1.4,'bandpass',300,2600,.08,1.3));at(23.3,t=>{noise(t,1.6,'lowpass',400,60,.25,.7,{att:.2});sweep(t,60,35,1.4,.3)});at(24.5,t=>bell(n('A6'),t,.07,2));
  const hz=['D4','Eb4','F#4','G4','A4','G4','F#4','Eb4','D4','F#4','A4','Bb4','A4','G4','F#4','Eb4'];k=0;for(let b=25.4;b<30.8;b+=.333,k++){if(k%2&&k%8!==3)continue;const nm=hz[k%16];at(b,t=>mallet(n(nm),t,.2))}
  for(let b=25.4;b<30.8;b+=1.333){at(b,t=>drum(t,.32));at(b+.667,t=>drum(t,.18));at(b+1,t=>drum(t,.22))}
  at(26.9,t=>{shimmer(t,1.8,.05);sweep(t,600,2400,1.4,.03,'sine',.6)});at(28.6,t=>{bell(n('D6'),t,.07,2.6);bell(n('A6'),t+.08,.05,2.4)});
  for(let b=32.4,i=0;b<37;b+=.5,i++)at(b,t=>tick(t,i%2?2300:3200,.07));
  k=0;for(let b=33.6;b<37;b+=.1667,k++){const nm=(b<34?['G4','B4','D5','G5']:['A4','C#5','E5','A5'])[k%4];at(b,t=>pluck(n(nm),t,.035,.35,{type:'sine',del:.25}))}
  at(34,t=>{sweep(t,260,420,.5,.04,'triangle',.3);bell(n('E6'),t+.3,.05,2)});
  at(37,t=>{shimmer(t,1.6,.05);sweep(t,400,1800,1.2,.025,'sine',.6)});at(38.7,t=>noise(t,1.2,'bandpass',300,2400,.09,1.2));
  ['D6','E6','F#6','A6','B6'].forEach((nm,i)=>at(39.6+i*.42,t=>{tick(t,2600,.05);bell(n(nm),t,.05,1.6)}));
  k=0;for(let b=37.4;b<42.9;b+=.333,k++){const nm=(b<40?['B4','F#5','D5','A5']:['G4','D5','B4','F#5'])[k%4];at(b,t=>pluck(n(nm),t,.055,.7,{type:'sine',del:.35}))}
  at(42.1,t=>{bell(n('A6'),t,.07,2.2)});
  [['F#5',43.6],['A5',44.6],['E5',45.6],['D5',46.4],['C#5',47.2],['E5',47.9]].forEach(([nm,tt])=>at(tt,t=>bell(n(nm),t,.075,2.6)));
  at(47.2,t=>noise(t,1.6,'bandpass',300,5200,.075,1.3,{att:1.55}));
  at(49.28,t=>shutter(t));at(49.33,t=>sweep(t,1500,6500,.2,.03,'sine',.2));
  at(49.5,t=>{noise(t,3.2,'highpass',2400,400,.2,.5,{att:.01,rev:.8});bell(n('D6'),t,.09,3.5);bell(n('A6'),t+.04,.06,3.5);bell(n('F#6'),t+.08,.05,3.5);sweep(t,80,38,1.6,.38,'sine',.3)});
  [['F#5',51.4],['A5',52.1],['E5',52.8],['D5',53.8],['A4',55.4]].forEach(([nm,tt])=>at(tt,t=>bell(n(nm),t,.08,2.8)));
  SC.sort((a,b)=>a.t-b.t)})();
function audioKill(){const c=AU.ctx;if(!c)return;const now=c.currentTime;for(const v of AU.voices){try{v.s.stop(now+.12)}catch(e){}}AU.voices=[]}
function audioRestart(){if(!AU.ctx||!AU.on)return;const c=AU.ctx;if(c.state==='suspended')c.resume();audioKill();const now=c.currentTime;
  AU.master.gain.cancelScheduledValues(now);AU.master.gain.setValueAtTime(0,now);AU.master.gain.linearRampToValueAtTime(.85,now+.25);
  AU.schedTo=G;for(const p of PADS)if(p.t<=G&&G<p.t+p.dur)pad(p.ms,now+.05,p.t+p.dur-G,p.v,p.cut)}
function audioHalt(){if(!AU.ctx)return;const c=AU.ctx,now=c.currentTime;AU.master.gain.cancelScheduledValues(now);AU.master.gain.setValueAtTime(AU.master.gain.value,now);AU.master.gain.linearRampToValueAtTime(0,now+.1);
  AU.voices.forEach(v=>{try{v.s.stop(now+.12)}catch(e){}});AU.voices=[]}
function audioTick(){if(!AU.ctx||!AU.on||!playing||dragging)return;const now=AU.ctx.currentTime,ahead=G+.15;
  if(AU.voices.length>500)AU.voices=AU.voices.filter(v=>v.end>now);
  for(const e of SC){if(e.t>ahead)break;if(e.t>AU.schedTo)e.fn(now+Math.max(0,e.t-G))}
  for(const p of PADS)if(p.t>AU.schedTo&&p.t<=ahead)pad(p.ms,now+Math.max(0,p.t-G),p.dur,p.v,p.cut);
  AU.schedTo=ahead}

/* ================= transport ================= */
const track=$('track'),fill=$('fill'),knob=$('knob'),pp=$('pp'),tc=$('tc'),intro=$('intro'),endEl=$('end'),flashEl=$('flash'),snd=$('snd');
CAPS.forEach(c=>{const d=document.createElement('div');d.className='tick';d.style.left=(c[0]/END*100)+'%';track.insertBefore(d,knob)});
const endPaths=[...endEl.querySelectorAll('.s')];
function setPlaying(v){playing=v;pp.textContent=v?'Pause':'Play';if(v){intro.classList.add('gone');if(G>=END-.01)G=0;audioRestart()}else audioHalt()}
function userPlay(){if(AU.on&&audioInit()&&AU.ctx.state==='suspended')AU.ctx.resume();setPlaying(true)}
pp.onclick=()=>playing?setPlaying(false):userPlay();
$('rp').onclick=()=>{G=0;userPlay()};$('again').onclick=()=>{G=0;userPlay()};$('go').onclick=userPlay;
cv.onclick=()=>playing?setPlaying(false):userPlay();
snd.onclick=()=>{AU.on=!AU.on;snd.textContent=AU.on?'Sound on':'Sound off';snd.setAttribute('aria-pressed',AU.on);if(AU.on){audioInit();if(playing)audioRestart()}else audioHalt()};
const seek=e=>{const r=track.getBoundingClientRect();G=clamp((e.clientX-r.left)/r.width)*END;intro.classList.add('gone')};
track.addEventListener('pointerdown',e=>{dragging=true;track.setPointerCapture(e.pointerId);audioHalt();seek(e)});
track.addEventListener('pointermove',e=>{if(dragging)seek(e)});
track.addEventListener('pointerup',()=>{dragging=false;if(playing)audioRestart()});
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();playing?setPlaying(false):userPlay()}
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){G=clamp(G+(e.key==='ArrowRight'?5:-5),0,END);intro.classList.add('gone');if(playing)audioRestart()}});

function texture(now){
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(vig,0,0,W,H);
  const k=RM?0:Math.floor(now/42);const pat=grains[k%4];ctx.save();ctx.translate(-(hash(k)*220|0),-(hash(k+.5)*220|0));ctx.globalAlpha=.45;ctx.fillStyle=pat;ctx.fillRect(0,0,W+220,H+220);ctx.restore();
  if(!RM){const b=Math.floor(now/180);if(hash(b*2.3)>.75){ctx.globalAlpha=.22;ctx.fillStyle=INK;const x=hash(b+.7)*W,y=hash(b+.9)*H;ctx.beginPath();ctx.arc(x,y,.6+hash(b)*1.1,0,TAU);ctx.fill()}}
}
const SCN=[[0,6.9,sBang,0],[5.9,13.4,sStar,6],[12.6,19.4,sMerge,13],[18.6,25.4,sDrift,19],[24.6,31.05,sGold,25],[30.95,37.05,sWatch,31],[36.95,43.4,sCam,37],[42.6,FLASH+.4,sCircle,43]];
function render(now){
  BOIL=RM?0:Math.floor(now/90);SEEDC=0;const t=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);PXS=1;
  const sp=ss(5.6,6.6,G)*(1-ss(42.6,43.4,G));if(sp>0){SA=sp*(G>24.6&&G<43?.35:1);stars(1,t,1.3)}
  for(const [a,b,fn,o] of SCN){if(G<=a||G>=b)continue;
    let fi=ss(a,a+.8,G),fo=1-ss(b-.8,b,G);
    if(fn===sBang)fi=1;if(fn===sGold)fo=1;if(fn===sWatch){fi=1;fo=1}if(fn===sCam)fi=1;if(fn===sCircle)fo=1;
    SA=fi*fo;if(SA>0)fn===sBang?fn(G):fn(G-o,t)}
  SA=1;PXS=1;ctx.setTransform(DPR,0,0,DPR,0,0);bloom();texture(now);
  flashEl.style.opacity=(ss(FLASH-.1,FLASH,G)*(1-ss(FLASH+.5,FLASH+2.6,G))).toFixed(3);
  const eo=ss(FLASH,FLASH+.15,G);endEl.style.opacity=eo;endEl.classList.toggle('live',eo>.5);
  endPaths.forEach((p,i)=>{const q=ss(FLASH+.7+i*.28,FLASH+2.4+i*.28,G);p.style.strokeDashoffset=(1-q).toFixed(4)});
  $('lfill').setAttribute('opacity',ss(FLASH+3.4,FLASH+4.6,G).toFixed(3));
  $('word').style.opacity=ss(FLASH+3,FLASH+4,G);$('tag').style.opacity=ss(FLASH+3.8,FLASH+5,G);$('meta').style.opacity=ss(FLASH+4.6,FLASH+5.6,G);$('backBtn').style.opacity=ss(FLASH+5.6,FLASH+6.6,G);$('again').style.opacity=ss(FLASH+5.6,FLASH+6.6,G);
  let ci=-1;for(let i=0;i<CAPS.length;i++)if(G>=CAPS[i][0]&&G<CAPS[i][1])ci=i;setCap(ci);
  const y=yearsAt(G);yrsEl.textContent=fmtY(y);agoEl.style.visibility=y<.5?'hidden':'visible';
  fill.style.width=(G/END*100)+'%';knob.style.left=(G/END*100)+'%';track.setAttribute('aria-valuenow',Math.round(G));
  const s=Math.floor(G);tc.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&!dragging){G+=dt;if(G>=END){G=END;setPlaying(false)}}
  audioTick();render(now);requestAnimationFrame(frame)}

/* when shown inside the Addo portfolio: offer a way back, and let Esc close the pop-up */
const EMBED=window.parent!==window||location.hash==='#embedded';
if(EMBED){document.documentElement.classList.add('embedded');const bb=$('backBtn');bb.hidden=false;const bye=()=>{try{window.parent.postMessage('addo:moment-close','*')}catch(e){}};bb.onclick=()=>{setPlaying(false);bye()};
  addEventListener('keydown',e=>{if(e.key==='Escape'){setPlaying(false);bye()}})}
window.__seek=v=>{G=v;intro.classList.add('gone');render(performance.now())};
requestAnimationFrame(frame);
})();
